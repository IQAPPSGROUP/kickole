name: Deploy Kickolé to Cloudflare Pages

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test
      - name: Build production assets
        env:
          VITE_ENVIRONMENT_THEME: beach
          # Publishable client key. Not a service-role secret.
          VITE_SUPABASE_URL: https://fjcidkbwxjimvxwzaoct.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cZICJMAPEFVMrHq6SysiEw_p_4PTVmA
        run: npm run build
      # main stays the production branch. Any other branch is a Pages preview
      # at https://<branch-alias>.<project>.pages.dev. A slash in the branch
      # name becomes a hyphen in that alias.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.ref_name }}
