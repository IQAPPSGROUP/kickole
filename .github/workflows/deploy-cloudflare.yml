name: Deploy Kickolé to Cloudflare Pages

# Only the live branch publishes the live site. A branch named preview, or
# preview/<name>, may publish a preview site. That is the preview branch the
# build rules name (for example preview/initial). Any other saved copy does
# not publish, including a manual run.
on:
  push:
    branches:
      - main
      - preview
      - 'preview/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # Same allow-list as the push filter, so a manual run of any other
    # saved copy does not publish a site.
    if: github.ref_name == 'main' || github.ref_name == 'preview' || startsWith(github.ref_name, 'preview/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test
      # Preview branches only. main leaves this unset, and the Capacitor
      # release scripts (ios:sync, cap:sync) never set it, so ?mockBoard=1
      # stays off store builds and production Pages.
      - name: Allow the review mock
        if: github.ref_name != 'main'
        run: echo "VITE_ALLOW_MOCK=1" >> "$GITHUB_ENV"
      - name: Build production assets
        env:
          VITE_ENVIRONMENT_THEME: beach
          # Publishable client key. Not a service-role secret.
          VITE_SUPABASE_URL: https://fjcidkbwxjimvxwzaoct.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cZICJMAPEFVMrHq6SysiEw_p_4PTVmA
        run: npm run build
      # main stays the production branch. A preview branch is a Pages preview
      # at https://<branch-alias>.<project>.pages.dev. A slash in the branch
      # name becomes a hyphen in that alias.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.ref_name }}
