name: Validate

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact commit SHA to validate (optional for manual runs)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify dispatched commit SHA
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo "HOLD: checkout SHA mismatch"; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Production web build
        env:
          VITE_ENVIRONMENT_THEME: beach
        run: npm run build

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      # v3's default package list includes the removed SDK "tools" package and fails
      # sdkmanager. v4 installs platform-tools only; pin API 36 to match compileSdk.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36'
      - run: npm ci
      - name: Build web assets for Capacitor
        run: |
          if [ -n "${VITE_ALLOW_MOCK:-}" ]; then
            echo "VITE_ALLOW_MOCK must not be set for a Capacitor build."
            exit 1
          fi
          npm run build:store
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
