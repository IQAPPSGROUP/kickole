name: Validate

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Production web build
        env:
          VITE_ENVIRONMENT_THEME: beach
        run: npm run build

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # v3's default package list includes the removed SDK "tools" package and fails
      # sdkmanager. v4 installs platform-tools only; pin API 36 to match compileSdk.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
      - run: npm ci
      - name: Build web assets for Capacitor
        run: |
          if [ -n "${VITE_ALLOW_MOCK:-}" ]; then
            echo "VITE_ALLOW_MOCK must not be set for a Capacitor build."
            exit 1
          fi
          npm run build:store
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
