# Kickolé iOS builds run on Codemagic Macs. No certificates, profiles, API keys,
# or the App Store Apple ID belong in this file. Signing uses the existing
# Codemagic integration "IQ APSS" and the env group app_store
# (APP_STORE_APPLE_ID and CERTIFICATE_PRIVATE_KEY), same as the other IQ apps.

workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    # Start from the Codemagic UI. Do not publish on every push.
    triggering:
      events: []
    integrations:
      app_store_connect: "IQ APSS"
    environment:
      node: "22"
      xcode: latest
      groups:
        - app_store
      vars:
        BUNDLE_ID: com.iqappsgroup.kickole
        # Publishable client key. Not a service-role secret.
        VITE_SUPABASE_URL: https://fjcidkbwxjimvxwzaoct.supabase.co
        VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cZICJMAPEFVMrHq6SysiEw_p_4PTVmA
        VITE_LEGAL_URL: https://kickole.pages.dev/legal/
    scripts:
      - name: Require the Kickolé App Store Apple ID
        script: |
          set -euo pipefail
          if [ -z "${APP_STORE_APPLE_ID:-}" ]; then
            echo "APP_STORE_APPLE_ID is missing."
            echo "In Codemagic, add APP_STORE_APPLE_ID to the app_store environment group."
            echo "Use the numeric Apple ID from App Store Connect > Kickolé > General > App Information."
            echo "Do not commit that value, and do not print it in the build log."
            exit 1
          fi
          echo "APP_STORE_APPLE_ID is set."
      - name: Require Xcode 26 or newer
        script: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version | awk 'NR==1 { print $2 }')"
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          echo "Xcode ${XCODE_VERSION}"
          if [ "${XCODE_MAJOR}" -lt 26 ]; then
            echo "Kickolé requires Xcode 26 or newer. This machine has Xcode ${XCODE_VERSION}."
            exit 1
          fi
      - name: Install npm dependencies
        script: |
          set -euo pipefail
          npm ci
      - name: Run tests and typecheck
        script: |
          set -euo pipefail
          npm test
          npm run typecheck
      - name: Build web assets and sync iOS
        script: |
          set -euo pipefail
          if [ -n "${VITE_ALLOW_MOCK:-}" ]; then
            echo "VITE_ALLOW_MOCK must not be set for a store build."
            exit 1
          fi
          npm run ios:sync
      - name: Set up code signing on the Xcode project
        script: |
          set -euo pipefail
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Set build number to the latest TestFlight build plus one
        script: |
          set -euo pipefail
          cd ios/App
          # The first build has no TestFlight builds yet, so treat no answer as 0.
          LATEST_BUILD_NUMBER="$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)"
          case "${LATEST_BUILD_NUMBER}" in
            ''|*[!0-9]*) LATEST_BUILD_NUMBER=0 ;;
          esac
          NEXT_BUILD_NUMBER="$((LATEST_BUILD_NUMBER + 1))"
          echo "Next CFBundleVersion: ${NEXT_BUILD_NUMBER}"
          agvtool new-version -all "${NEXT_BUILD_NUMBER}"
      - name: Build the App Store IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme App \
            --config Release \
            --no-show-build-settings
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  ios-simulator:
    name: iOS Simulator compile check
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events: []
    environment:
      node: "22"
      xcode: latest
      vars:
        VITE_SUPABASE_URL: https://fjcidkbwxjimvxwzaoct.supabase.co
        VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cZICJMAPEFVMrHq6SysiEw_p_4PTVmA
    scripts:
      - name: Require Xcode 26 or newer
        script: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version | awk 'NR==1 { print $2 }')"
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          echo "Xcode ${XCODE_VERSION}"
          if [ "${XCODE_MAJOR}" -lt 26 ]; then
            echo "Kickolé requires Xcode 26 or newer. This machine has Xcode ${XCODE_VERSION}."
            exit 1
          fi
      - name: Install npm dependencies
        script: |
          set -euo pipefail
          npm ci
      - name: Build web assets and sync iOS
        script: |
          set -euo pipefail
          if [ -n "${VITE_ALLOW_MOCK:-}" ]; then
            echo "VITE_ALLOW_MOCK must not be set for a store build."
            exit 1
          fi
          npm run ios:sync
      - name: Compile for the iOS Simulator without signing
        script: |
          set -euo pipefail
          xcodebuild \
            -project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
    artifacts:
      - /tmp/xcodebuild_logs/*.log

  android-internal:
    name: Android Play internal
    max_build_duration: 90
    instance_type: mac_mini_m2
    # Start from the Codemagic UI. Do not publish on every push.
    # Internal draft only. Production Play stays unpublished.
    triggering:
      events: []
    environment:
      node: "22"
      java: 21
      android_signing:
        - kickole
      groups:
        - google_play
      vars:
        PACKAGE_NAME: com.iqappsgroup.kickole
        # Publishable client key. Not a service-role secret.
        VITE_SUPABASE_URL: https://fjcidkbwxjimvxwzaoct.supabase.co
        VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cZICJMAPEFVMrHq6SysiEw_p_4PTVmA
        VITE_LEGAL_URL: https://kickole.pages.dev/legal/
    scripts:
      - name: Require the upload keystore and Play credentials
        script: |
          set -euo pipefail
          if [ -z "${CM_KEYSTORE_PATH:-}" ] || [ -z "${CM_KEYSTORE_PASSWORD:-}" ] || [ -z "${CM_KEY_ALIAS:-}" ] || [ -z "${CM_KEY_PASSWORD:-}" ]; then
            echo "The Kickolé upload keystore is missing."
            echo "In Codemagic, add an Android keystore with the reference name kickole."
            echo "Do not commit the keystore, and do not print the passwords."
            exit 1
          fi
          if [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS:-}" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS is missing."
            echo "Add that secret to the google_play environment group."
            echo "Do not commit the JSON key, and do not print it."
            exit 1
          fi
          echo "Android signing and Play credentials are set."
      - name: Install npm dependencies
        script: |
          set -euo pipefail
          npm ci
      - name: Run tests and typecheck
        script: |
          set -euo pipefail
          npm test
          npm run typecheck
      - name: Build web assets and sync Android
        script: |
          set -euo pipefail
          if [ -n "${VITE_ALLOW_MOCK:-}" ]; then
            echo "VITE_ALLOW_MOCK must not be set for a store build."
            exit 1
          fi
          npm run build:store
          npx cap sync android
      - name: Build the signed Android App Bundle
        script: |
          set -euo pipefail
          VERSION_CODE="${PROJECT_BUILD_NUMBER:-1}"
          case "${VERSION_CODE}" in
            ''|*[!0-9]*) VERSION_CODE=1 ;;
          esac
          echo "Android versionCode: ${VERSION_CODE}"
          export KICKOLE_VERSION_CODE="${VERSION_CODE}"
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
